name: Stream Test

on:
  workflow_dispatch:

jobs:
  stream-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install FFmpeg, Fonts, and gdown
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu python3-pip
        pip3 install gdown

    - name: Download Test Video
      run: |
        # Download your 4-second test video here
        gdown "https://drive.google.com/uc?id=1w8MCzUtFpN01Mk3UXr6IGipXBxvc_FUn" -O test.mp4

    - name: Run Video Stream Test
      run: |
        VIDEO_FILE="test.mp4"
        FONT_PATH="fonts/SofiaProBold.otf"

        START_EPOCH=$(date +%s)
        PHT_EPOCH=$((START_EPOCH + 28800))

        # 4s video + 5s restart screen = 9s timeout total
        timeout 35s ffmpeg -re -i "$VIDEO_FILE" \
        -filter_complex "[0:v] \
        drawtext=fontfile='${FONT_PATH}':text='UTC Time - %{pts\:localtime\:${START_EPOCH}\:%Y-%m-%d  %H.%M.%S}':x=20:y=20:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.4, \
        drawtext=fontfile='${FONT_PATH}':text='My Time (PHT) - %{pts\:localtime\:${PHT_EPOCH}\:%Y-%m-%d  %H.%M.%S}':x=20:y=55:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.4, \
        drawtext=fontfile='${FONT_PATH}':text='Restarting stream...':x=(w-text_w)/2:y=(h-text_h)/2:fontsize=48:fontcolor=yellow:box=1:boxcolor=black@0.7:enable='between(t,30,35)'" \
        -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
        -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -f flv \
        rtmp://a.rtmp.youtube.com/live2/${{ secrets.NCS_KEY }} || true
