name: 24/7 Ilocano Stream

concurrency: 
  group: ilocano-stream
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install FFmpeg, Fonts, and gdown
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu python3-pip
        pip3 install gdown

    - name: Download Video from Google Drive
      run: |
        gdown "https://drive.google.com/uc?id=1mZAYvQNg8R3g1nOgbcpHSvtuqD_wayKE" -O ilocano_bg.mp4

    - name: Run Video Stream with Text Overlay
      run: |
        VIDEO_FILE="ilocano_bg.mp4"
        FONT_PATH="fonts/SofiaProBold.otf"

        START_EPOCH=$(date +%s)
        PHT_EPOCH=$((START_EPOCH + 28800))

        ffmpeg -re -i "$VIDEO_FILE" \
        -filter_complex "[0:v] \
        drawtext=fontfile='${FONT_PATH}':text='UTC Time - %{pts\:localtime\:${START_EPOCH}\:%Y-%m-%d  %H.%M.%S}':x=20:y=20:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.4, \
        drawtext=fontfile='${FONT_PATH}':text='My Time (PHT) - %{pts\:localtime\:${PHT_EPOCH}\:%Y-%m-%d  %H.%M.%S}':x=20:y=55:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.4, \
        drawtext=fontfile='${FONT_PATH}':text='Unix Time - %{eif\:${START_EPOCH}+t\:d}':x=20:y=90:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.4" \
        -c:v libx264 -preset ultrafast -b:v 2500k -maxrate 2500k -bufsize 5000k \
        -pix_fmt yuv420p -g 60 -c:a aac -b:a 128k -ar 44100 -f flv \
        rtmp://ingest.global-contribute.live-video.net/app/${{ secrets.AA_KEY }} || true

    - name: Automatically Trigger Next Stream
      if: always()
      run: |
        curl -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/ilocano-stream.yml/dispatches \
          -d '{"ref":"main"}' || true
          
